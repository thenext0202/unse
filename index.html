  :root{

    --ink-soft:#6b5d4d;     /* 보조 글자 */
    --paper:#f7efe1;        /* 한지 배경 */
    --paper-2:#fffaf1;      /* 카드 배경 */
    --night:#1c1838;        /* 밤하늘 */
    --night-2:#2a234f;
    --gold:#c89b3c;         /* 금색 포인트 */
    --gold-soft:#e7cf95;
    --red:#9e3b32;          /* 단청 붉은색 (포인트) */
    --line:#e3d6bf;         /* 구분선 */
    --radius:18px;
    --good:#2f6fb0;         /* 좋음 (파랑) */
    --mid:#b9ad97;          /* 보통 (회색) */
    --warn:#cf4a3c;         /* 조심 (빨강) */
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:'Pretendard',sans-serif;
    background:var(--paper);
    color:var(--ink);
    font-size:18px;            /* 50대 가독성: 기본 18px */
    line-height:1.75;
    word-break:keep-all;       /* 한글 단어 단위 줄바꿈 */
  }
  .serif{font-family:'Gowun Batang',serif;}
  .wrap{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);position:relative;overflow:hidden;}

  /* ── 헤더(밤하늘) ── */
  .hero{

      radial-gradient(1px 1px at 70% 20%, #fff5 0, transparent 100%),
      radial-gradient(1.5px 1.5px at 45% 60%, #fff6 0, transparent 100%),
      radial-gradient(1px 1px at 85% 70%, #fff4 0, transparent 100%),
      linear-gradient(165deg,var(--night) 0%, var(--night-2) 100%);
    color:#fff;
    padding:48px 28px 40px;
    text-align:center;
    position:relative;
  }
  .hero::after{
    content:"";position:absolute;left:0;right:0;bottom:-1px;height:24px;
    background:radial-gradient(60% 100% at 50% 0,var(--night-2),transparent 70%);
  }
  .badge{
    display:inline-block;font-size:14px;letter-spacing:2px;
    color:var(--gold-soft);border:1px solid #ffffff30;
    padding:6px 16px;border-radius:999px;margin-bottom:18px;
  }
  .hero h1{font-size:30px;font-weight:700;letter-spacing:1px;}
  .hero .moon{font-size:40px;display:block;margin-bottom:10px;}
  .hero .week{margin-top:14px;font-size:17px;color:#e9e2ff;}
  .hero .greet{margin-top:20px;font-size:18px;color:#fff;opacity:.95;}
  .hero .greet b{color:var(--gold-soft);}

  /* ── 공통 섹션 ── */
  .pad{padding:32px 24px;}
  .lead{text-align:center;margin-bottom:24px;}
  .lead .step{font-size:14px;color:var(--gold);letter-spacing:1px;font-weight:700;}
  .lead h2{font-size:23px;font-weight:700;margin-top:6px;}
  .lead p{color:var(--ink-soft);font-size:16px;margin-top:8px;}

  /* ── 띠 선택 그리드 ── */
  .zgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .zbtn{
    background:var(--paper-2);border:2px solid var(--line);border-radius:var(--radius);
    padding:14px 6px;text-align:center;cursor:pointer;min-height:120px;
    transition:transform .12s,border-color .12s,background .12s;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    font-family:inherit;color:var(--ink);
  }
  .zbtn .emo{font-size:28px;line-height:1;}
  .zbtn .nm{font-size:16px;font-weight:600;}
  .zbtn .yrs{font-size:11px;color:var(--ink-soft);line-height:1.45;letter-spacing:-.2px;}
  .zbtn:active{transform:scale(.96);}
  .zbtn.on{border-color:var(--gold);background:#fff7e6;box-shadow:0 4px 16px #c89b3c33;}

  /* ── 성별 토글 ── */
  .gender{display:flex;gap:12px;margin-top:24px;}
  .gbtn{
    flex:1;background:var(--paper-2);border:2px solid var(--line);border-radius:var(--radius);
    padding:18px 0;font-size:19px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink);
    transition:.12s;
  }
  .gbtn:active{transform:scale(.97);}
  .gbtn.on{border-color:var(--gold);background:#fff7e6;color:var(--red);}

  .cta{
    display:block;width:100%;margin-top:28px;padding:20px;border:none;border-radius:var(--radius);
    background:var(--red);color:#fff;font-size:20px;font-weight:700;font-family:inherit;cursor:pointer;
    letter-spacing:1px;transition:.12s;box-shadow:0 6px 20px #9e3b3240;
  }
  .cta:active{transform:scale(.98);}
  .cta:disabled{background:#c9bca8;box-shadow:none;cursor:default;}

  /* ── 운세 화면 ── */
  #view-fortune{display:none;}
  .ftop{
    background:linear-gradient(165deg,var(--night),var(--night-2));color:#fff;
    padding:32px 24px;text-align:center;

  .ftop .title{font-size:26px;font-weight:700;margin-top:8px;}
  .stars{font-size:26px;letter-spacing:4px;margin-top:14px;color:var(--gold);}
  .stars .off{opacity:.25;}
  .score{font-size:15px;color:#e9e2ff;margin-top:6px;}

  .card{
    background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;margin:16px 0;
  }
  .card h3{
    font-size:14px;color:var(--gold);font-weight:700;letter-spacing:1px;
    display:flex;align-items:center;gap:8px;margin-bottom:12px;
  }
  .card h3 .ic{font-size:18px;}
  .card .body{font-size:18px;line-height:1.8;}
  .card.signal{border-color:var(--gold);background:#fffaf0;}

  /* 요일 흐름 */
  .flow-legend{display:flex;justify-content:center;gap:18px;margin-bottom:16px;font-size:14px;color:var(--ink-soft);}
  .flow-legend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block;}
  .bg-good{background:var(--good);} .bg-mid{background:var(--mid);} .bg-warn{background:var(--warn);}
  .t-good{color:var(--good);} .t-mid{color:var(--ink-soft);} .t-warn{color:var(--warn);}
  .week-flow{display:flex;gap:6px;align-items:flex-end;height:112px;margin-top:6px;}
  .wf{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;}
  .wf .wlabel{font-size:12px;font-weight:700;}
  .wf .bar{width:100%;max-width:30px;border-radius:8px;}
  .wf .d{font-size:14px;color:var(--ink-soft);font-weight:600;}

  /* 행운 요소 */
  .luck{display:flex;gap:10px;flex-wrap:wrap;}
  .chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:15px;}
  .chip b{color:var(--red);margin-left:2px;}

  /* 추천/피하기 리스트 (이모지 불릿) */
  .ol{list-style:none;}
  .ol li{padding:11px 0;font-size:18px;line-height:1.6;border-bottom:1px solid var(--line);}
  .ol li:last-child{border-bottom:none;}
  /* 음식 리스트 */
  .food{list-style:none;}
  .food li{padding:10px 0;border-bottom:1px solid var(--line);font-size:18px;line-height:1.5;}
  .food li:last-child{border-bottom:none;}
  .food li b{color:var(--ink);font-weight:700;}
  .food li span{color:var(--ink-soft);}
  /* 요일 흐름 예언 텍스트 */
  .wf-notes{margin-top:20px;border-top:1px solid var(--line);padding-top:14px;}
  .wf-notes div{font-size:16px;line-height:1.6;padding:6px 0;}
  .wf-notes b{color:var(--gold);font-weight:700;margin-right:8px;}

  .wisdom{
    text-align:center;font-family:'Gowun Batang',serif;font-size:21px;line-height:1.7;
    color:var(--night);background:#fffaf0;border:1px dashed var(--gold);border-radius:var(--radius);
    padding:28px 22px;margin:16px 0;

  .wisdom::before{content:"❝";color:var(--gold);font-size:28px;display:block;}

  .next{background:linear-gradient(165deg,var(--night),var(--night-2));color:#fff;border:none;}
  .next h3{color:var(--gold-soft);}
  .next .body{color:#efeaff;}

  .back{
    display:block;width:100%;margin:24px 0 8px;padding:16px;background:transparent;
    border:2px solid var(--line);border-radius:var(--radius);color:var(--ink-soft);
    font-size:17px;font-family:inherit;cursor:pointer;
  }

  .placeholder{text-align:center;color:var(--ink-soft);padding:40px 20px;font-size:17px;}

  .foot{padding:28px 24px 44px;text-align:center;color:var(--ink-soft);font-size:13px;line-height:1.7;border-top:1px solid var(--line);}

  /* 등장 애니메이션 */
  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  .anim{animation:rise .5s ease both;}
</style>

/* =========================================================
   이하 동작 코드 — 건드릴 일 거의 없음
   ========================================================= */
let sel = {z:null, g:null};

// 띠 버튼 그리기
const grid = document.getElementById('zgrid');
ZODIAC.forEach((z,i)=>{
  const b=document.createElement('button');
  // 이 띠에 해당하는 출생연도 자동 계산 (1948~2008, 두 자리로 표시)
  const yrs=[];
  for(let y=1948;y<=2008;y++){ if((((y-4-i)%12)+12)%12===0) yrs.push("'"+("0"+(y%100)).slice(-2)); }
  b.className='zbtn';
  b.innerHTML=`<span class="emo">${z.emo}</span><span class="nm">${z.k}띠</span><span class="yrs">${yrs.join(' · ')}</span>`;
  b.onclick=()=>pickZodiac(z.k,b);
  grid.appendChild(b);
});

function pickZodiac(k,el){
  sel.z=k;
  document.querySelectorAll('.zbtn').forEach(x=>x.classList.remove('on'));
  el.classList.add('on');
  checkReady();
}
function pickGender(g,el){
  sel.g=g;
  document.querySelectorAll('.gbtn').forEach(x=>x.classList.remove('on'));
  el.classList.add('on');
  checkReady();
}
function checkReady(){
  document.getElementById('goBtn').disabled = !(sel.z && sel.g);
}

// 이름 변수 (이프두 링크에 ?name=홍길동 형태로 넣으면 인사 표시됨)
(function(){
  const n = new URLSearchParams(location.search).get('name');
  if(n){
    const g=document.getElementById('greet');
    g.style.display='block';
    g.innerHTML = `<b>${n}</b>님, 이번 주 건강 흐름을 살펴봤어요.`;
  }
})();

function showFortune(){
  const key = `${sel.z}_${sel.g}`;
  const f = FORTUNES[key];

  // GA4 맞춤 이벤트: 어떤 띠·성별을 봤는지 기록
  if(typeof gtag==='function'){
    gtag('event','select_fortune',{ddi:sel.z, gender:sel.g, character:key});
  }

  document.getElementById('f-who').textContent = `${sel.z}띠 · ${sel.g}성`;
  const body = document.getElementById('f-body');

  if(!f){
    document.getElementById('f-stars').textContent='';
    document.getElementById('f-score').textContent='';
    body.innerHTML = `<div class="placeholder anim">🙏<br><br>${sel.z}띠 ${sel.g}성 운세는<br>아직 준비 중이에요.</div>` + backBtn();
    swap();
    return;
  }

  // 별점 — 스펙 구간 (85+5★ / 70+4★ / 55+3★ / 40+2★ / 그외 1★)
  const st = f.score>=85?5 : f.score>=70?4 : f.score>=55?3 : f.score>=40?2 : 1;
  document.getElementById('f-stars').innerHTML =
    '★'.repeat(st) + `<span class="off">${'★'.repeat(5-st)}</span>`;
  document.getElementById('f-score').textContent = `건강 기운 ${f.score}점`;

  // 요일 흐름 — 색(파랑=좋음/회색=보통/빨강=조심) 막대 + 예언 텍스트
  const days=['월','화','수','목','금','토','일'];
  const LV={3:{c:'good',t:'좋음',h:64}, 2:{c:'mid',t:'보통',h:42}, 1:{c:'warn',t:'조심',h:26}};
  const wf = f.weekflow.map((lv,i)=>{
    const m = LV[lv] || LV[2];
    return `<div class="wf">
      <div class="wlabel t-${m.c}">${m.t}</div>
      <div class="bar bg-${m.c}" style="height:${m.h}px"></div>
      <div class="d">${days[i]}</div></div>`;
  }).join('');
  const flowLegend = `<div class="flow-legend">
    <span><i class="dot bg-good"></i>좋음</span>
    <span><i class="dot bg-mid"></i>보통</span>
    <span><i class="dot bg-warn"></i>조심</span></div>`;
  const flowNotes = (f.weekflowNote||[]).length
    ? `<div class="wf-notes">${f.weekflowNote.map(s=>`<div><b>${s.seg}</b>${s.txt}</div>`).join('')}</div>` : '';

  body.innerHTML = `
    ${card('🌿','총운', f.summary)}
    ${card('💫',`이번 주 건강 포인트 · ${f.signalArea}`, f.signalText, 'signal')}
    ${cardRaw('📅','이번 주 요일 흐름', flowLegend + `<div class="week-flow">${wf}</div>` + flowNotes)}
    ${cardRaw('✅','추천 행동', olHtml(f.doRec))}
    ${cardRaw('⚠️','피하면 좋은 것', olHtml(f.avoid), 'avoid')}
    ${card('🌱','이번 주 작은 습관', f.ritual)}
    ${cardRaw('🍵','추천 음식', foodHtml(f.food))}
    ${card('🤝','사람운', f.people)}
    ${cardRaw('🎴','행운 요소', `<div class="luck">
        <span class="chip">🎨 색 <b>${f.luck.color}</b></span>
        <span class="chip">🍲 음식 <b>${f.luck.food}</b></span>
        <span class="chip">🧭 방향 <b>${f.luck.direction}</b></span>
        <span class="chip">🕐 시간 <b>${f.luck.time}</b></span></div>`)}
    <div class="wisdom anim">${f.wisdom}</div>
    ${cardRaw('🔮','다음 주 미리보기', `<div class="body">${f.nextweek}</div>`,'next')}
    ${backBtn()}
  `;
  swap();
}

function card(ic,t,b,extra=''){return cardRaw(ic,t,`<div class="body">${b}</div>`,extra);}
function cardRaw(ic,t,inner,extra=''){
  return `<div class="card ${extra} anim"><h3><span class="ic">${ic}</span>${t}</h3>${inner}</div>`;
}
// 번호 리스트 (추천 행동·피하기) — 배열 받음
function olHtml(arr){return `<ul class="ol">${(arr||[]).map(x=>`<li>${x}</li>`).join('')}</ul>`;}
// 음식 리스트 — "음식명 — 효능표현" 배열 받음
function foodHtml(arr){return `<ul class="food">${(arr||[]).map(x=>{
  const p=x.split(' — '); return `<li><b>${p[0]}</b>${p[1]?` <span>— ${p[1]}</span>`:''}</li>`;
}).join('')}</ul>`;}
function backBtn(){return `<button class="back" onclick="goBack()">← 다른 띠 다시 보기</button>`;}

function swap(){
  document.getElementById('view-select').style.display='none';
  document.getElementById('view-fortune').style.display='block';
  window.scrollTo(0,0);
}
function goBack(){
  document.getElementById('view-fortune').style.display='none';
  document.getElementById('view-select').style.display='block';
  window.scrollTo(0,0);
}

/* 스크롤 깊이 측정 (체류·관심도 KPI용) — GA4로 25/50/75/100% 전송 */
(function(){
  const marks=[25,50,75,100]; const sent={};
  window.addEventListener('scroll',()=>{
    const h=document.documentElement;
    const p=Math.round((h.scrollTop)/(h.scrollHeight-h.clientHeight)*100);
    marks.forEach(m=>{
      if(p>=m && !sent[m]){sent[m]=1;
        if(typeof gtag==='function') gtag('event','scroll_depth',{percent:m});
      }
    });
  },{passive:true});
})();
</script>
